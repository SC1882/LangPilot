name: Build
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build application
        run: chmod +x build-app.sh && ./build-app.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/LangPilot.app LangPilot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LangPilot-unsigned
          path: LangPilot.zip
